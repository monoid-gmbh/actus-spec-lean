name = "actus"
defaultTargets = ["Actus", "Test"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.30.0"

[[lean_lib]]
name = "Actus"
# Include every submodule in the library (not just the root `Actus` module), so
# doc-gen4 generates API pages for them — PAM/LAM/NAM/ANN, the utility layer,
# the metatheorems, etc.  `Actus.*` = `Actus` and all submodules.
globs = ["Actus.*"]

[[lean_lib]]
name = "Test"
# The test suite (rfl-checked cash-flow theorems + `#eval` demos).  A separate
# library so it is built by `lake build` (it is in `defaultTargets`) but kept
# out of the documented `Actus` API surface that doc-gen4 generates.
globs = ["Test.*"]

[[lean_exe]]
name = "conformance"
root = "Actus.IO.Conformance"
